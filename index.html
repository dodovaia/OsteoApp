<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Font for improved aesthetics -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <title>OstéoSuivi – Bêta</title>
    <!-- Manifest and theme color for PWA installation -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2c3e50" />
    
    <!-- Styles copied from the original design -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            min-height: 100vh;
        }
        .sidebar {
            flex: 0 0 250px;
            background-color: #2E86C1;
            color: #fff;
            padding: 20px;
        }
        .sidebar h2 {
            margin-top: 0;
        }
        .client-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .client-list li {
            padding: 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .client-list li.selected, .client-list li:hover {
            background-color: #5499C7;
        }
        .main {
            flex: 1;
            padding: 20px;
            background-color: #fff;
        }
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .exercise-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .exercise-table th, .exercise-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .exercise-table td input[type="text"] {
            width: 100%;
        }
        .add-form {
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .add-form input[type="text"] {
            padding: 6px;
            margin-right: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .add-form button {
            padding: 6px 10px;
            border: none;
            background-color: #2E86C1;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Progress bar styles */
        .progress-bar-container {
            width: 100%;
            background-color: #eaeaea;
            border-radius: 4px;
            height: 12px;
            margin-top: 4px;
        }
        .progress-bar {
            height: 100%;
            border-radius: 4px;
            background-color: #58D68D;
            width: 0%;
        }
        /* UI aesthetic overrides */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f7;
            color: #2c3e50;
        }
        .sidebar {
            flex: 0 0 260px;
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
            color: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .main {
            flex: 1;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            margin: 10px;
        }
        .client-list li.selected, .client-list li:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .exercise-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
        }
        .exercise-table th,
        .exercise-table td {
            padding: 10px;
            text-align: left;
        }
        .exercise-table thead {
            background-color: #ecf0f1;
        }
        .exercise-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .exercise-table td input[type="text"] {
            width: 100%;
        }
        .add-form button {
            padding: 6px 14px;
            border: none;
            background-color: #3498db;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .add-form button:hover {
            background-color: #2980b9;
        }
        .progress-bar {
            background-color: #2ecc71;
        }
        .delete-btn {
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 1em;
            margin-left: 6px;
            padding: 0;
        }
        .delete-btn:hover {
            color: #e74c3c;
        }
        .client-delete-btn {
            color: #ffffff;
        }
        .client-delete-btn:hover {
            color: #e74c3c;
        }

        /* Login screen styling */
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h1 {
            margin-bottom: 20px;
        }
        .login-buttons button {
            width: 100%;
            padding: 10px 16px;
            margin-top: 10px;
            border: none;
            background-color: #3498db;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .login-buttons button:hover {
            background-color: #2980b9;
        }
        .login-select {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        @media (max-width: 600px) {
            .sidebar {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        // Plain JavaScript implementation of the OstéoSuivi app
        let role = 'login';
        let clients = [];
        let nextClientId = 1;
        let nextExerciseId = 1;
        let selectedClientId = null;
        let loggedClientId = null;

        // Load persisted data from localStorage
        function loadData() {
            try {
                const storedClients = localStorage.getItem('clients');
                const storedNextClientId = localStorage.getItem('nextClientId');
                const storedNextExerciseId = localStorage.getItem('nextExerciseId');
                clients = storedClients ? JSON.parse(storedClients) : [];
                nextClientId = storedNextClientId ? Number(storedNextClientId) : 1;
                nextExerciseId = storedNextExerciseId ? Number(storedNextExerciseId) : 1;
            } catch (e) {
                console.error('Failed to parse stored data:', e);
                clients = [];
                nextClientId = 1;
                nextExerciseId = 1;
            }
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('clients', JSON.stringify(clients));
            localStorage.setItem('nextClientId', nextClientId);
            localStorage.setItem('nextExerciseId', nextExerciseId);
        }

        // Compute global progress across all clients
        function computeGlobalProgress() {
            let completed = 0;
            let total = 0;
            clients.forEach(client => {
                client.exercises.forEach(ex => {
                    total++;
                    if (ex.completed) completed++;
                });
            });
            return { completed, total };
        }

        // Main render function
        function render() {
            const root = document.getElementById('root');
            root.innerHTML = '';
            if (role === 'login') {
                renderLogin(root);
            } else {
                renderMain(root);
            }
        }

        // Render the login screen
        function renderLogin(root) {
            const container = document.createElement('div');
            container.className = 'login-container';
            const title = document.createElement('h2');
            title.textContent = 'Bienvenue !';
            container.appendChild(title);
            const loginButtons = document.createElement('div');
            loginButtons.className = 'login-buttons';
            // Osteopath login
            const osteoBtn = document.createElement('button');
            osteoBtn.className = 'login-button';
            osteoBtn.textContent = 'Se connecter comme ostéopathe';
            osteoBtn.addEventListener('click', () => {
                role = 'osteopath';
                selectedClientId = null;
                render();
            });
            loginButtons.appendChild(osteoBtn);
            // Patient login
            const patientContainer = document.createElement('div');
            patientContainer.className = 'login-patient-container';
            const select = document.createElement('select');
            select.className = 'login-select';
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = 'Choisir un patient';
            select.appendChild(defaultOption);
            clients.forEach(client => {
                const opt = document.createElement('option');
                opt.value = client.id;
                opt.textContent = client.name;
                select.appendChild(opt);
            });
            let patientSelection = '';
            select.addEventListener('change', e => {
                patientSelection = e.target.value;
            });
            const patientBtn = document.createElement('button');
            patientBtn.className = 'login-button';
            patientBtn.textContent = 'Se connecter comme patient';
            patientBtn.addEventListener('click', () => {
                const id = Number(patientSelection);
                const found = clients.find(c => c.id === id);
                if (found) {
                    role = 'patient';
                    selectedClientId = id;
                    loggedClientId = id;
                    render();
                }
            });
            patientContainer.appendChild(select);
            patientContainer.appendChild(patientBtn);
            loginButtons.appendChild(patientContainer);
            container.appendChild(loginButtons);
            root.appendChild(container);
        }

        // Render the main dashboard (osteopath or patient view)
        function renderMain(root) {
            const container = document.createElement('div');
            container.className = 'container';
            // Sidebar
            const sidebar = document.createElement('div');
            sidebar.className = 'sidebar';
            const h2 = document.createElement('h2');
            h2.textContent = 'Patients';
            sidebar.appendChild(h2);
            const ul = document.createElement('ul');
            ul.className = 'client-list';
            clients.forEach(client => {
                const li = document.createElement('li');
                li.className = 'client-list-item';
                const info = document.createElement('div');
                info.className = 'client-info';
                info.textContent = client.name;
                info.addEventListener('click', () => {
                    selectedClientId = client.id;
                    render();
                });
                li.appendChild(info);
                if (role === 'osteopath') {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-client-button';
                    deleteBtn.textContent = '×';
                    deleteBtn.addEventListener('click', e => {
                        e.stopPropagation();
                        if (window.confirm('Êtes-vous sûr de vouloir supprimer ce patient ?')) {
                            clients = clients.filter(c => c.id !== client.id);
                            if (selectedClientId === client.id) {
                                selectedClientId = null;
                            }
                            saveData();
                            render();
                        }
                    });
                    info.appendChild(deleteBtn);
                }
                // Progress bar for client
                const progressContainer = document.createElement('div');
                progressContainer.className = 'progress-bar-container';
                const progressBar = document.createElement('div');
                progressBar.className = 'progress-bar';
                const completedCount = client.exercises.filter(ex => ex.completed).length;
                const totalCount = client.exercises.length;
                const percent = totalCount ? Math.round((completedCount / totalCount) * 100) : 0;
                progressBar.style.width = percent + '%';
                progressContainer.appendChild(progressBar);
                li.appendChild(progressContainer);
                const percentSpan = document.createElement('span');
                percentSpan.className = 'progress-percent';
                percentSpan.textContent = percent + '%';
                li.appendChild(percentSpan);
                ul.appendChild(li);
            });
            sidebar.appendChild(ul);
            if (role === 'osteopath') {
                // Add client form
                const addClientSection = document.createElement('div');
                addClientSection.className = 'add-client-section';
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = 'Nom du patient';
                let newClientName = '';
                input.addEventListener('input', e => {
                    newClientName = e.target.value;
                });
                const addBtn = document.createElement('button');
                addBtn.textContent = 'Ajouter';
                addBtn.addEventListener('click', () => {
                    const name = newClientName.trim();
                    if (name !== '') {
                        clients.push({ id: nextClientId++, name, exercises: [] });
                        saveData();
                        render();
                    }
                });
                addClientSection.appendChild(input);
                addClientSection.appendChild(addBtn);
                sidebar.appendChild(addClientSection);
                // Global progress summary
                const globalProgress = document.createElement('div');
                globalProgress.className = 'global-progress';
                const gp = computeGlobalProgress();
                const globalPercent = gp.total ? Math.round((gp.completed / gp.total) * 100) : 0;
                const gTitle = document.createElement('h3');
                gTitle.textContent = 'Progression globale';
                const gBarContainer = document.createElement('div');
                gBarContainer.className = 'progress-bar-container';
                const gBar = document.createElement('div');
                gBar.className = 'progress-bar';
                gBar.style.width = globalPercent + '%';
                gBarContainer.appendChild(gBar);
                const gPercent = document.createElement('span');
                gPercent.className = 'progress-percent';
                gPercent.textContent = globalPercent + '%';
                globalProgress.appendChild(gTitle);
                globalProgress.appendChild(gBarContainer);
                globalProgress.appendChild(gPercent);
                sidebar.appendChild(globalProgress);
            }
            // Logout button
            const logoutBtn = document.createElement('button');
            logoutBtn.className = 'logout-button';
            logoutBtn.textContent = '⎋';
            logoutBtn.addEventListener('click', () => {
                role = 'login';
                selectedClientId = null;
                loggedClientId = null;
                render();
            });
            sidebar.appendChild(logoutBtn);
            container.appendChild(sidebar);
            // Main content
            const main = document.createElement('div');
            main.className = 'main';
            const selectedClient = clients.find(c => c.id === selectedClientId);
            if (selectedClient) {
                const hClient = document.createElement('h2');
                hClient.textContent = selectedClient.name;
                main.appendChild(hClient);
                const completed = selectedClient.exercises.filter(ex => ex.completed).length;
                const total = selectedClient.exercises.length;
                const percent = total ? Math.round((completed / total) * 100) : 0;
                const summary = document.createElement('div');
                summary.className = 'patient-summary';
                const summaryH3 = document.createElement('h3');
                summaryH3.textContent = 'Progression : ' + completed + ' / ' + total + ' exercices (' + percent + '%)';
                const barContainer = document.createElement('div');
                barContainer.className = 'progress-bar-container';
                const bar = document.createElement('div');
                bar.className = 'progress-bar';
                bar.style.width = percent + '%';
                barContainer.appendChild(bar);
                const percentSpan2 = document.createElement('span');
                percentSpan2.className = 'progress-percent';
                percentSpan2.textContent = percent + '%';
                summary.appendChild(summaryH3);
                summary.appendChild(barContainer);
                summary.appendChild(percentSpan2);
                main.appendChild(summary);
                // Add exercise form (osteopath only)
                if (role === 'osteopath') {
                    const exInputSection = document.createElement('div');
                    exInputSection.className = 'exercise-input';
                    const exInput = document.createElement('input');
                    exInput.type = 'text';
                    exInput.placeholder = 'Nouvel exercice';
                    let newExerciseName = '';
                    exInput.addEventListener('input', e => {
                        newExerciseName = e.target.value;
                    });
                    const exAddBtn = document.createElement('button');
                    exAddBtn.textContent = 'Ajouter';
                    exAddBtn.addEventListener('click', () => {
                        const title = newExerciseName.trim();
                        if (title !== '') {
                            selectedClient.exercises.push({ id: nextExerciseId++, name: title, completed: false, pain: '', comment: '' });
                            saveData();
                            render();
                        }
                    });
                        exInputSection.appendChild(exInput);
                        exInputSection.appendChild(exAddBtn);
                        main.appendChild(exInputSection);
                }
                // Table of exercises
                const table = document.createElement('table');
                table.className = 'exercise-table';
                const thead = document.createElement('thead');
                const headRow = document.createElement('tr');
                ['Exercice', 'Terminé', 'Douleur (0-10)', 'Commentaire', 'Supprimer'].forEach(text => {
                    const th = document.createElement('th');
                    th.textContent = text;
                    headRow.appendChild(th);
                });
                thead.appendChild(headRow);
                table.appendChild(thead);
                const tbody = document.createElement('tbody');
                selectedClient.exercises.forEach(ex => {
                    const tr = document.createElement('tr');
                    const tdName = document.createElement('td');
                    tdName.textContent = ex.name;
                    tr.appendChild(tdName);
                    const tdCompleted = document.createElement('td');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = ex.completed;
                    checkbox.disabled = role !== 'osteopath';
                    checkbox.addEventListener('change', () => {
                        ex.completed = checkbox.checked;
                        saveData();
                        render();
                    });
                    tdCompleted.appendChild(checkbox);
                    tr.appendChild(tdCompleted);
                    const tdPain = document.createElement('td');
                    const painInput = document.createElement('input');
                    painInput.type = 'number';
                    painInput.min = '0';
                    painInput.max = '10';
                    painInput.value = ex.pain;
                    painInput.disabled = role !== 'osteopath';
                    painInput.addEventListener('input', () => {
                        ex.pain = painInput.value;
                        saveData();
                    });
                    tdPain.appendChild(painInput);
                    tr.appendChild(tdPain);
                    const tdComment = document.createElement('td');
                    const commentInput = document.createElement('input');
                    commentInput.type = 'text';
                    commentInput.value = ex.comment;
                    commentInput.disabled = role !== 'osteopath';
                    commentInput.addEventListener('input', () => {
                        ex.comment = commentInput.value;
                        saveData();
                    });
                    tdComment.appendChild(commentInput);
                    tr.appendChild(tdComment);
                    const tdDelete = document.createElement('td');
                    if (role === 'osteopath') {
                        const delBtn = document.createElement('button');
                        delBtn.textContent = '🗑️';
                        delBtn.addEventListener('click', () => {
                            selectedClient.exercises = selectedClient.exercises.filter(e => e.id !== ex.id);
                            saveData();
                            render();
                        });
                        tdDelete.appendChild(delBtn);
                    }
                    tr.appendChild(tdDelete);
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                main.appendChild(table);
            } else {
                const msg = document.createElement('div');
                msg.className = 'no-client-selected';
                msg.textContent = 'Sélectionnez un patient pour voir les détails';
                main.appendChild(msg);
            }
            container.appendChild(main);
            root.appendChild(container);
        }

        // Initialize the app on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            render();
        });

        // Register service worker for offline support and PWA installation
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
