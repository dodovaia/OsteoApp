<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Font for improved aesthetics -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <title>OstéoSuivi – Bêta</title>
    <!-- Manifest and theme color for PWA installation -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2c3e50" />
    <!-- React via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel to allow JSX in browser -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            min-height: 100vh;
        }
        .sidebar {
            flex: 0 0 250px;
            background-color: #2E86C1;
            color: #fff;
            padding: 20px;
        }
        .sidebar h2 {
            margin-top: 0;
        }
        .client-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .client-list li {
            padding: 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .client-list li.selected, .client-list li:hover {
            background-color: #5499C7;
        }
        .main {
            flex: 1;
            padding: 20px;
            background-color: #fff;
        }
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .exercise-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .exercise-table th, .exercise-table td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .exercise-table td input[type="text"] {
            width: 100%;
        }
        .add-form {
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .add-form input[type="text"] {
            padding: 6px;
            margin-right: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .add-form button {
            padding: 6px 10px;
            border: none;
            background-color: #2E86C1;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Progress bar styles */
        .progress-container {
            width: 100%;
            background-color: #eaeaea;
            border-radius: 4px;
            height: 12px;
            margin-top: 4px;
        }
        .progress-bar {
            height: 100%;
            border-radius: 4px;
            background-color: #58D68D;
            width: 0%;
        }
        /* UI aesthetic overrides */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f7;
            color: #2c3e50;
        }
        .sidebar {
            flex: 0 0 260px;
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%);
            color: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .main {
            flex: 1;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            margin: 10px;
        }
        .client-list li.selected, .client-list li:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        .exercise-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            border-radius: 6px;
            overflow: hidden;
        }
        .exercise-table th,
        .exercise-table td {
            padding: 10px;
            text-align: left;
        }
        .exercise-table thead {
            background-color: #ecf0f1;
        }
        .exercise-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .exercise-table td input[type="text"] {
            width: 100%;
        }
        .add-form button {
            padding: 6px 14px;
            border: none;
            background-color: #3498db;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .add-form button:hover {
            background-color: #2980b9;
        }
        .progress-bar {
            background-color: #2ecc71;
        }
        .delete-btn {
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font-size: 1em;
            margin-left: 6px;
            padding: 0;
        }
        .delete-btn:hover {
            color: #e74c3c;
        }
        .client-delete-btn {
            color: #ffffff;
        }
        .client-delete-btn:hover {
            color: #e74c3c;
        }

        /* Login screen styling */
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h1 {
            margin-bottom: 20px;
        }
        .login-options button {
            width: 100%;
            padding: 10px 16px;
            margin-top: 10px;
            border: none;
            background-color: #3498db;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .login-options button:hover {
            background-color: #2980b9;
        }
        .login-options select {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        @media (max-width: 600px) {
            .sidebar {
                flex: 0 0 100%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Load from localStorage or set default data
            const initialClients = () => {
                const stored = localStorage.getItem('clients');
                if (stored) {
                    try {
                        return JSON.parse(stored);
                    } catch (e) {
                        console.error('Erreur de parsing:', e);
                    }
                }
                // Default sample data
                return [
                    {
                        id: 1,
                        nom: 'Jean Dupont',
                        exercices: [
                            { id: 1, nom: 'Étirement cervical', fini: false, commentaire: '' },
                            { id: 2, nom: 'Renforcement lombaire', fini: true, commentaire: 'Douleur légère' },
                        ],
                    },
                    {
                        id: 2,
                        nom: 'Marie Martin',
                        exercices: [
                            { id: 1, nom: 'Exercice de posture', fini: false, commentaire: '' },
                        ],
                    },
                ];
            };
            const [clients, setClients] = useState(initialClients);
            const [selectedClientId, setSelectedClientId] = useState(
                clients.length > 0 ? clients[0].id : null
            );
            const [nouveauClientNom, setNouveauClientNom] = useState('');
            const [nouvelExerciceNom, setNouvelExerciceNom] = useState('');

            // Gestion des rôles et de la connexion
            // role: 'login' (écran de connexion), 'osteopath' (praticien) ou 'patient'
            const [role, setRole] = useState('login');
            // ID du patient connecté lorsqu'on est en mode patient
            const [loggedClientId, setLoggedClientId] = useState(null);
            // Sélection dans le menu déroulant sur l'écran de connexion pour choisir un patient
            const [selectedLoginClientId, setSelectedLoginClientId] = useState(null);

            // Fonction pour se connecter en tant qu'ostéopathe
            const loginAsOsteo = () => {
                setRole('osteopath');
                // Sélectionner le premier patient par défaut s'il existe
                if (clients.length > 0) {
                    setSelectedClientId(clients[0].id);
                } else {
                    setSelectedClientId(null);
                }
            };

            // Fonction pour se connecter en tant que patient à partir du menu déroulant
            const loginAsPatient = () => {
                if (!selectedLoginClientId) return;
                setRole('patient');
                setLoggedClientId(selectedLoginClientId);
                setSelectedClientId(selectedLoginClientId);
            };

            // Fonction de déconnexion qui réinitialise l'état de connexion
            const logout = () => {
                setRole('login');
                setLoggedClientId(null);
                setSelectedLoginClientId(null);
            };

            // Supprimer un patient
            const supprimerClient = (id) => {
                if (!confirm('Supprimer ce patient ?')) return;
                setClients((prev) => prev.filter((c) => c.id !== id));
                if (selectedClientId === id) {
                    setSelectedClientId(null);
                }
            };

            // Supprimer un exercice pour un patient
            const supprimerExercice = (clientId, exerciceId) => {
                setClients((prevClients) =>
                    prevClients.map((client) =>
                        client.id === clientId
                            ? {
                                  ...client,
                                  exercices: client.exercices.filter((ex) => ex.id !== exerciceId),
                              }
                            : client
                    )
                );
            };

            // Mettre à jour le niveau de douleur pour un exercice
            const mettreAJourDouleur = (clientId, exerciceId, niveau) => {
                const value = Number(niveau);
                setClients((prevClients) =>
                    prevClients.map((client) =>
                        client.id === clientId
                            ? {
                                  ...client,
                                  exercices: client.exercices.map((ex) =>
                                      ex.id === exerciceId ? { ...ex, niveauDouleur: value } : ex
                                  ),
                              }
                            : client
                    )
                );
            };

            // Calculer le nombre total et complété d'exercices pour tous les patients
            const globalTotals = React.useMemo(() => {
                const total = clients.reduce((acc, c) => acc + c.exercices.length, 0);
                const completed = clients.reduce(
                    (acc, c) => acc + c.exercices.filter((ex) => ex.fini).length,
                    0
                );
                const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
                return { total, completed, percentage };
            }, [clients]);

            useEffect(() => {
                // Save clients to localStorage whenever they change
                localStorage.setItem('clients', JSON.stringify(clients));
            }, [clients]);

            const ajouterClient = (e) => {
                e.preventDefault();
                if (!nouveauClientNom.trim()) return;
                const newClient = {
                    id: Date.now(),
                    nom: nouveauClientNom.trim(),
                    exercices: [],
                };
                setClients([...clients, newClient]);
                setNouveauClientNom('');
                setSelectedClientId(newClient.id);
            };

            const ajouterExercice = (e) => {
                e.preventDefault();
                if (!nouvelExerciceNom.trim() || selectedClientId == null) return;
                setClients((prevClients) =>
                    prevClients.map((client) =>
                        client.id === selectedClientId
                            ? {
                                  ...client,
                                  exercices: [
                                      ...client.exercices,
                                      {
                                          id: Date.now(),
                                          nom: nouvelExerciceNom.trim(),
                                          fini: false,
                                          commentaire: '',
                                          niveauDouleur: 0,
                                      },
                                  ],
                              }
                            : client
                    )
                );
                setNouvelExerciceNom('');
            };

            const toggleFini = (clientId, exerciceId) => {
                setClients((prevClients) =>
                    prevClients.map((client) =>
                        client.id === clientId
                            ? {
                                  ...client,
                                  exercices: client.exercices.map((ex) =>
                                      ex.id === exerciceId
                                          ? { ...ex, fini: !ex.fini }
                                          : ex
                                  ),
                              }
                            : client
                    )
                );
            };

            const mettreAJourCommentaire = (clientId, exerciceId, nouveauTexte) => {
                setClients((prevClients) =>
                    prevClients.map((client) =>
                        client.id === clientId
                            ? {
                                  ...client,
                                  exercices: client.exercices.map((ex) =>
                                      ex.id === exerciceId
                                          ? { ...ex, commentaire: nouveauTexte }
                                          : ex
                                  ),
                              }
                            : client
                    )
                );
            };

            const selectedClient = clients.find((c) => c.id === selectedClientId);

            /* Interface de connexion */
            if (role === 'login') {
                return (
                    <div className="login-container">
                        <h1>OstéoSuivi</h1>
                        <div className="login-options">
                            <button onClick={loginAsOsteo}>Se connecter en tant qu’ostéopathe</button>
                            <select
                                value={selectedLoginClientId || ''}
                                onChange={(e) => setSelectedLoginClientId(e.target.value ? Number(e.target.value) : null)}
                            >
                                <option value="">-- Choisir un patient --</option>
                                {clients.map((c) => (
                                    <option key={c.id} value={c.id}>
                                        {c.nom}
                                    </option>
                                ))}
                            </select>
                            <button
                                onClick={loginAsPatient}
                                disabled={!selectedLoginClientId}
                            >
                                Se connecter en tant que patient
                            </button>
                        </div>
                    </div>
                );
            }

            /* Interface principale : ostéopathe ou patient */
            return (
                <div className="container">
                    <div className="sidebar">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <h2>{role === 'patient' ? 'Patient' : 'Patients'}</h2>
                            <button
                                className="delete-btn"
                                onClick={logout}
                                title="Se déconnecter"
                                style={{ color: '#fff', fontSize: '1.2em' }}
                            >
                                ⎋
                            </button>
                        </div>
                        {/* Liste des patients (cachée pour les patients) */}
                        {role === 'osteopath' && (
                            <>
                                <ul className="client-list">
                                    {clients.map((client) => (
                                        <li
                                            key={client.id}
                                            className={client.id === selectedClientId ? 'selected' : ''}
                                            onClick={() => setSelectedClientId(client.id)}
                                        >
                                            {client.nom}
                                            {/* Suppression d'un patient accessible uniquement à l'ostéopathe */}
                                            <button
                                                className="delete-btn client-delete-btn"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    supprimerClient(client.id);
                                                }}
                                                title="Supprimer le patient"
                                            >
                                                ×
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                                {/* Formulaire d'ajout de patient pour l'ostéopathe */}
                                <form className="add-form" onSubmit={ajouterClient}>
                                    <input
                                        type="text"
                                        placeholder="Nouveau patient"
                                        value={nouveauClientNom}
                                        onChange={(e) => setNouveauClientNom(e.target.value)}
                                    />
                                    <button type="submit">Ajouter</button>
                                </form>
                                {/* Progression globale visible uniquement à l'ostéopathe */}
                                {globalTotals.total > 0 && (
                                    <div style={{ marginTop: '20px' }}>
                                        <strong>
                                            Progression globale : {globalTotals.completed}/{globalTotals.total} ({globalTotals.percentage}%)
                                        </strong>
                                        <div className="progress-container">
                                            <div
                                                className="progress-bar"
                                                style={{ width: globalTotals.percentage + '%' }}
                                            ></div>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                        {/* Affichage du nom du patient pour un patient connecté */}
                        {role === 'patient' && selectedClient && (
                            <div style={{ padding: '10px 0' }}>
                                <strong>{selectedClient.nom}</strong>
                            </div>
                        )}
                    </div>
                    <div className="main">
                        {selectedClient ? (
                            <div>
                                <div className="client-header">
                                    <h2>{selectedClient.nom}</h2>
                                </div>
                                {/* Progression du client sélectionné */}
                                {selectedClient.exercices.length > 0 && (() => {
                                    const completed = selectedClient.exercices.filter((ex) => ex.fini).length;
                                    const total = selectedClient.exercices.length;
                                    const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
                                    return (
                                        <div style={{ marginBottom: '10px' }}>
                                            <strong>
                                                Progression : {completed}/{total} ({percentage}%)
                                            </strong>
                                            <div className="progress-container">
                                                <div
                                                    className="progress-bar"
                                                    style={{ width: percentage + '%' }}
                                                ></div>
                                            </div>
                                        </div>
                                    );
                                })()}
                                {/* Formulaire d'ajout d'exercice uniquement pour l'ostéopathe */}
                                {role === 'osteopath' && (
                                    <form className="add-form" onSubmit={ajouterExercice}>
                                        <input
                                            type="text"
                                            placeholder="Nom de l'exercice"
                                            value={nouvelExerciceNom}
                                            onChange={(e) => setNouvelExerciceNom(e.target.value)}
                                        />
                                        <button type="submit">Ajouter exercice</button>
                                    </form>
                                )}
                                {selectedClient.exercices.length > 0 ? (
                                    <table className="exercise-table">
                                        <thead>
                                            <tr>
                                                <th>Exercice</th>
                                                <th>Terminé</th>
                                                <th>Douleur (0–10)</th>
                                                <th>Commentaire</th>
                                                {role === 'osteopath' && <th>Action</th>}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {selectedClient.exercices.map((ex) => (
                                                <tr key={ex.id}>
                                                    <td>{ex.nom}</td>
                                                    <td>
                                                        <input
                                                            type="checkbox"
                                                            checked={ex.fini}
                                                            onChange={() =>
                                                                toggleFini(selectedClient.id, ex.id)
                                                            }
                                                        />
                                                    </td>
                                                    <td>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            max="10"
                                                            value={typeof ex.niveauDouleur === 'number' ? ex.niveauDouleur : 0}
                                                            onChange={(e) =>
                                                                mettreAJourDouleur(
                                                                    selectedClient.id,
                                                                    ex.id,
                                                                    e.target.value
                                                                )
                                                            }
                                                            style={{ width: '60px' }}
                                                        />
                                                    </td>
                                                    <td>
                                                        <input
                                                            type="text"
                                                            value={ex.commentaire}
                                                            onChange={(e) =>
                                                                mettreAJourCommentaire(
                                                                    selectedClient.id,
                                                                    ex.id,
                                                                    e.target.value
                                                                )
                                                            }
                                                            placeholder="Notes"
                                                        />
                                                    </td>
                                                    {role === 'osteopath' && (
                                                        <td>
                                                            <button
                                                                className="delete-btn"
                                                                onClick={() => supprimerExercice(selectedClient.id, ex.id)}
                                                                title="Supprimer l'exercice"
                                                            >
                                                                🗑️
                                                            </button>
                                                        </td>
                                                    )}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                ) : (
                                    <p>Aucun exercice attribué.</p>
                                )}
                            </div>
                        ) : (
                            <p>Sélectionnez un patient pour voir ses exercices.</p>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        // Enregistrement du service worker pour activer l'installation PWA et le cache offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('service-worker.js')
                    .catch((err) => console.error('Service worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
